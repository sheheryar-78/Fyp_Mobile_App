# Codemagic CI/CD Build Configuration for NexCall Mobile App
workflows:
  flutter-android-build:
    name: NexCall Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - env_vars # optional
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Recreate Android Project Folder
        script: |
          cd Mobile
          flutter create --org com.nexcall --platforms=android .
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdk 36
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
      - name: Get Flutter Packages
        script: |
          cd Mobile
          flutter pub get
      - name: Build Release APK
        script: |
          cd Mobile
          flutter build apk --release
    artifacts:
      - Mobile/build/app/outputs/flutter-apk/app-release.apk
