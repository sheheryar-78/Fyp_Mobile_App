name: nexcall_mobile
description: NexCall AI Voice Agent Platform mobile application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP request client
  http: ^1.2.1

  # Local token & user persistence
  shared_preferences: ^2.2.3

  # Analytics chart library
  fl_chart: ^0.66.0

  # Custom utilities and date formatting
  intl: ^0.19.0

  # File Picker for knowledge base documents
  file_picker: ^8.0.0

  # Stripe checkout link opener
  url_launcher: ^6.2.5

  # Google Fonts — Inter typeface
  google_fonts: ^6.2.1

  # Shimmer skeleton loading states
  shimmer: ^3.0.0

  # Shared animations and page transitions
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
