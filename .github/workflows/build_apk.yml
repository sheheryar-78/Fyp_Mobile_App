name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Folder
        run: |
          cd Mobile
          flutter create --org com.nexcall --platforms=android .

      - name: Force Android Compile SDK to 36
        run: |
          cat << 'EOF' >> Mobile/android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdk 36
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: |
          cd Mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd Mobile
          flutter build apk --release --verbose

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexcall-app-release
          path: Mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
