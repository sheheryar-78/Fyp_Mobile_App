name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -Dorg.gradle.daemon=false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android project folder
        run: |
          cd Mobile
          flutter create --org com.nexcall --project-name nexcall_mobile --platforms=android temp_android
          cp -r temp_android/android/ android/
          rm -rf temp_android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Get packages
        run: |
          cd Mobile
          flutter pub get

      - name: Build APK
        run: |
          cd Mobile
          flutter build apk --release

      - name: Show error log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat Mobile/build_log.txt 2>/dev/null || echo "No build log"
          echo "=== FLUTTER DOCTOR ==="
          flutter doctor -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcall-app-release
          path: Mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
