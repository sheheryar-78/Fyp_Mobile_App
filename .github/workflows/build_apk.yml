name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -Dorg.gradle.daemon=false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Recreate Android project folder
        run: |
          cd Mobile
          flutter create --org com.nexcall --project-name nexcall_mobile --platforms=android temp_android
          cp -r temp_android/android/ android/
          rm -rf temp_android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Get packages
        run: |
          cd Mobile
          flutter pub get

      - name: Build Debug APK
        id: build_debug
        run: |
          cd Mobile
          flutter build apk --debug 2>&1

      - name: Build Release APK
        id: build_release
        run: |
          cd Mobile
          flutter build apk --release 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcall-app-release
          path: Mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore