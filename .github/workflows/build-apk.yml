name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android project folder
        run: |
          cd Mobile
          flutter create --org com.nexcall --platforms=android .

      - name: Patch compileSdkVersion and minSdkVersion in app/build.gradle
        run: |
          FILE="Mobile/android/app/build.gradle"
          # Patch compileSdk
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          # Patch minSdk
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$FILE"
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$FILE"
          echo "--- Patched app/build.gradle ---"
          cat "$FILE"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get packages
        run: |
          cd Mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd Mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcall-app-release
          path: Mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
